[package]
name = "custom-virtiofsd"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.8.4"
libc = "0.2"
log = "0.4"
vhost = "0.14.0"
vhost-user-backend = "0.20.0"
virtiofsd = { path = "vendor/virtiofsd-1.13.2-ubuntu", default-features = false }
vm-memory = { version = "0.16.0", features = ["backend-mmap", "backend-atomic"] }
